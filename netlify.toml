[build]
  base    = "site"
  publish = "public"
  command = "npm ci && npm run build"

[build.environment]
  HUGO_VERSION = "0.157.0"
  GO_VERSION   = "1.25.0"
  NODE_VERSION = "20"
  GIT_DEPTH    = "0"

[context.deploy-preview]
  command = "npm ci && npm run build:hugo -- --buildDrafts --buildFuture --baseURL $DEPLOY_PRIME_URL && npm run index"

[context.branch-deploy]
  command = "npm ci && npm run build:hugo -- --buildDrafts --buildFuture --baseURL $DEPLOY_PRIME_URL && npm run index"
