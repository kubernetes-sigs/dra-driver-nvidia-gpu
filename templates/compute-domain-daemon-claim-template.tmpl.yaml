---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  namespace: {{ .Namespace }}
  name: {{ .Name }}
  finalizers:
    - {{ .Finalizer }}
  labels:
    {{ .ComputeDomainLabelKey }}: {{ .ComputeDomainLabelValue }}
    {{ .TargetLabelKey }}: {{ .TargetLabelValue }}
spec:
  spec:
    devices:
      requests:
      - name: daemon
        exactly:
          deviceClassName: {{ .DeviceClassName }}
{{- if .OwnerTolerationValue }}
          tolerations:
          - key: {{ .OwnerTolerationKey }}
            operator: Equal
            value: "{{ .OwnerTolerationValue }}"
            effect: NoSchedule
{{- end }}
      config:
      - requests: ["daemon"]
        opaque:
          driver: {{ .DriverName }}
          parameters:
            apiVersion: {{ .DaemonConfig.APIVersion }}
            kind: {{ .DaemonConfig.Kind }}
            domainID: {{ .DaemonConfig.DomainID }}
