{{- $root := "" }}{{ if .ChrootDriverRoot }}{{ $root = "/driver-root" }}{{ end -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .MpsControlDaemonNamespace }}
  name: {{ .MpsControlDaemonName }}
  labels:
    app: {{ .MpsControlDaemonName }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .MpsControlDaemonName }}
  template:
    metadata:
      labels:
        app: {{ .MpsControlDaemonName }}
    spec:
      {{- if .ServiceAccountName }}
      serviceAccountName: {{ .ServiceAccountName }}
      {{- end }}
      nodeName: {{ .NodeName }}
      hostPID: true
      {{- if .MpsImagePullSecretNames }}
      imagePullSecrets:
      {{- range .MpsImagePullSecretNames }}
      - name: {{ . }}
      {{- end }}
      {{- end }}
      containers:
      - name: mps-control-daemon
        image: {{ .MpsImageName }}
        {{- if .MpsImagePullPolicy }}
        imagePullPolicy: {{ .MpsImagePullPolicy }}
        {{- end }}
        securityContext:
          privileged: true
        command: [sh, -c]
        args:
        - |-
          set -e
          rm -f {{ $root }}/var/log/nvidia-mps/startup.log
          {{- if .ChrootDriverRoot }}

          # Run against the driver root's own libc and loader.
          RUN="chroot /driver-root sh -c"
          {{- else }}

          # No shell in the driver root (e.g. GKE COS): expose only NVIDIA
          # libraries so the driver root's libc never reaches the loader.
          export PATH="/driver-root/usr/bin:/driver-root/bin:/driver-root/usr/local/bin:$PATH"
          mkdir -p /tmp/nvidia-libs
          for dir in /driver-root/usr/lib64 /driver-root/usr/lib/x86_64-linux-gnu /driver-root/usr/lib/aarch64-linux-gnu /driver-root/usr/lib /driver-root/lib64 /driver-root/lib/x86_64-linux-gnu /driver-root/lib/aarch64-linux-gnu /driver-root/lib; do
            for lib in "$dir"/libcuda.so* "$dir"/libnvidia-*.so*; do
              link="/tmp/nvidia-libs/${lib##*/}"
              if [ -e "$lib" ] && [ ! -e "$link" ] && [ ! -L "$link" ]; then
                ln -s "$lib" "$link"
              fi
            done
          done
          export LD_LIBRARY_PATH=/tmp/nvidia-libs
          RUN="sh -c"
          {{- end }}

          $RUN "nvidia-cuda-mps-control -d{{ if .MultiUser }} -M{{ end }}"
          {{- if .DefaultActiveThreadPercentage }}
          $RUN "echo set_default_active_thread_percentage {{.DefaultActiveThreadPercentage}} | nvidia-cuda-mps-control"
          {{- end}}
          {{- range $id, $limit := .DefaultPinnedDeviceMemoryLimits }}
          $RUN "echo set_default_device_pinned_mem_limit {{ $id }} {{ $limit }} | nvidia-cuda-mps-control"
          {{- end}}

          echo "startup complete" > {{ $root }}/var/log/nvidia-mps/startup.log

          tail -n +1 -f {{ $root }}/var/log/nvidia-mps/control.log
        startupProbe:
          exec:
            command:
            - cat
            - {{ $root }}/var/log/nvidia-mps/startup.log
          initialDelaySeconds: 1
          periodSeconds: 1
        env:
        - name: CUDA_VISIBLE_DEVICES
          value: "{{ .CUDA_VISIBLE_DEVICES }}"
        {{- if .FeatureGates }}
        # Feature gates (includes both project-specific and logging features)
        - name: FEATURE_GATES
          value: "{{ range $key, $value := .FeatureGates }}{{ $key }}={{ $value }},{{ end }}"
        {{- end }}
        volumeMounts:
        - name: driver-root
          mountPath: /driver-root
          {{- if not .ChrootDriverRoot }}
          readOnly: true
          {{- end }}
        - name: mps-shm-directory
          mountPath: {{ $root }}/dev/shm
        - name: mps-pipe-directory
          mountPath: {{ $root }}/tmp/nvidia-mps
        - name: mps-log-directory
          mountPath: {{ $root }}/var/log/nvidia-mps
      volumes:
      - name: driver-root
        hostPath:
          path: {{ .NvidiaDriverRoot }}
      - name: mps-shm-directory
        hostPath:
          path: {{ .MpsShmDirectory }}
      - name: mps-pipe-directory
        hostPath:
          path: {{ .MpsPipeDirectory }}
      - name: mps-log-directory
        hostPath:
          path: {{ .MpsLogDirectory }}
