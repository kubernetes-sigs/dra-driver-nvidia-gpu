apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: rct-mig-small
  labels:
    env: batssuite
spec:
  spec:
    devices:
      requests:
      - name: mig1g
        exactly:
          deviceClassName: mig.nvidia.com
          selectors:
          - cel:
              # Request the smallest GPU-slice profile without depending on
              # the model-specific amount of memory in that profile.
              expression: device.attributes['gpu.nvidia.com'].profile.startsWith('1g.')
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-mig-small
  labels:
    env: batssuite
spec:
  containers:
  - name: ctr
    image: ubuntu:22.04
    command: ["bash", "-c"]
    args: ["nvidia-smi -L; trap 'exit 0' TERM; sleep 9999 & wait"]
    resources:
      claims:
      - name: migdev
  resourceClaims:
  - name: migdev
    resourceClaimTemplateName: rct-mig-small
