---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.1
  name: computedomaindaemonsets.resource.nvidia.com
spec:
  group: resource.nvidia.com
  names:
    kind: ComputeDomainDaemonSet
    listKind: ComputeDomainDaemonSetList
    plural: computedomaindaemonsets
    shortNames:
    - cdds
    singular: computedomaindaemonset
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.numberReady
      name: Ready
      type: integer
    - jsonPath: .status.desiredNumberScheduled
      name: Desired
      type: integer
    - jsonPath: .status.updatedNumberScheduled
      name: Updated
      type: integer
    - jsonPath: .status.numberCliques
      name: Cliques
      type: integer
    - jsonPath: .spec.updateStrategy.type
      name: Strategy
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: |-
          ComputeDomainDaemonSet runs one IMEX daemon on every node of every NVLink
          clique, shared by all ComputeDomains. It is used when imex.mode is
          driverManaged and imex.scope is cluster, where each ComputeDomain gets its
          own IMEX channels instead of its own IMEX daemons.

          The cluster admin creates and updates it, not Helm, so that driver upgrades
          do not restart IMEX daemons under running workloads. It must exist before
          workloads can use ComputeDomains.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            default: {}
            description: ComputeDomainDaemonSetSpec configures the IMEX daemons.
            properties:
              image:
                description: |-
                  Image of the IMEX daemon pods. When empty, the driver image at creation
                  is kept, so that driver upgrades do not change the daemons. Set it to
                  upgrade them.
                maxLength: 1024
                type: string
                x-kubernetes-validations:
                - message: image must not contain spaces
                  rule: '!self.contains('' '')'
              imagePullSecrets:
                description: ImagePullSecrets in the driver namespace for the IMEX
                  daemon pods.
                items:
                  description: |-
                    LocalObjectReference contains enough information to let you locate the
                    referenced object inside the same namespace.
                  properties:
                    name:
                      default: ""
                      description: |-
                        Name of the referent.
                        This field is effectively required, but due to backwards compatibility is
                        allowed to be empty. Instances of this type with an empty value here are
                        almost certainly wrong.
                        More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                      type: string
                  type: object
                  x-kubernetes-map-type: atomic
                type: array
                x-kubernetes-list-type: atomic
              imexConfig:
                additionalProperties:
                  type: string
                description: IMEXConfig overrides, or adds, nvidia-imex config file
                  settings.
                maxProperties: 64
                type: object
                x-kubernetes-validations:
                - message: imexConfig keys must be nvidia-imex setting names
                  rule: self.all(k, k.matches('^[A-Za-z_][A-Za-z0-9_]*$'))
              logVerbosity:
                default: 1
                description: LogVerbosity of the IMEX daemon pods.
                maximum: 7
                minimum: 0
                type: integer
              maxNodesPerClique:
                default: 18
                description: |-
                  MaxNodesPerClique bounds the number of IMEX daemons per NVLink clique.
                  It sizes the static IMEX nodes config and cannot be changed.
                maximum: 1024
                minimum: 1
                type: integer
                x-kubernetes-validations:
                - message: maxNodesPerClique is immutable
                  rule: self == oldSelf
              nodeSelector:
                additionalProperties:
                  type: string
                description: |-
                  NodeSelector restricts the IMEX daemons to matching nodes. Daemons only
                  run on nodes that belong to an NVLink clique.
                type: object
              priorityClassName:
                description: PriorityClassName of the IMEX daemon pods.
                type: string
              resources:
                description: Resources of the IMEX daemon container.
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This field depends on the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              updateStrategy:
                default:
                  type: OnDelete
                description: UpdateStrategy decides how IMEX daemons pick up spec
                  changes.
                properties:
                  rollingUpdate:
                    description: RollingUpdate configures RollingUpdate.
                    properties:
                      maxUnavailableCliques:
                        anyOf:
                        - type: integer
                        - type: string
                        default: 1
                        description: |-
                          MaxUnavailableCliques is the number, or percentage, of cliques that
                          are updated at a time. A percentage rounds down, to at least 1.
                        x-kubernetes-int-or-string: true
                      minReadySeconds:
                        default: 30
                        description: |-
                          MinReadySeconds is how long all daemons of an updated clique must be
                          ready before the next batch starts.
                        format: int32
                        minimum: 0
                        type: integer
                      paused:
                        description: Paused stops starting new batches. A batch in
                          progress completes.
                        type: boolean
                    type: object
                  type:
                    default: OnDelete
                    description: |-
                      Type is OnDelete (default) or RollingUpdate. With OnDelete, daemons
                      keep their revision until their pods are deleted. With RollingUpdate,
                      the controller restarts outdated daemons one batch of whole cliques at
                      a time.
                    enum:
                    - OnDelete
                    - RollingUpdate
                    type: string
                type: object
                x-kubernetes-validations:
                - message: rollingUpdate requires type RollingUpdate
                  rule: self.type == 'RollingUpdate' || !has(self.rollingUpdate)
            type: object
          status:
            description: ComputeDomainDaemonSetStatus reports the IMEX daemons.
            properties:
              cliques:
                description: Cliques reports the daemons of each NVLink clique, sorted
                  by ID.
                items:
                  description: ComputeDomainDaemonSetCliqueStatus reports the IMEX
                    daemons of one clique.
                  properties:
                    id:
                      type: string
                    nodes:
                      format: int32
                      type: integer
                    readyNodes:
                      format: int32
                      type: integer
                    updatedNodes:
                      description: UpdatedNodes is the number of daemons on the current
                        revision.
                      format: int32
                      type: integer
                  required:
                  - id
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - id
                x-kubernetes-list-type: map
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              desiredNumberScheduled:
                format: int32
                type: integer
              image:
                description: Image of the current revision.
                type: string
              numberCliques:
                format: int32
                type: integer
              numberReady:
                format: int32
                type: integer
              observedGeneration:
                description: ObservedGeneration is the generation the status reflects.
                format: int64
                type: integer
              updatedNumberScheduled:
                description: |-
                  UpdatedNumberScheduled is the number of daemons on the current
                  revision.
                format: int32
                type: integer
            type: object
        type: object
        x-kubernetes-validations:
        - message: the ComputeDomainDaemonSet must be named default
          rule: self.metadata.name == 'default'
    served: true
    storage: true
    subresources:
      status: {}
