{{- if .Values.resources.computeDomains.enabled }}
{{- if and .Values.controller.pdb .Values.controller.pdb.enabled (gt (int .Values.controller.replicas) 1) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "dra-driver-nvidia-gpu.name" . }}-controller
  namespace: {{ include "dra-driver-nvidia-gpu.namespace" . }}
  labels:
    {{- include "dra-driver-nvidia-gpu.labels" . | nindent 4 }}
spec:
  {{- if ne .Values.controller.pdb.maxUnavailable nil }}
  maxUnavailable: {{ .Values.controller.pdb.maxUnavailable }}
  {{- else if ne .Values.controller.pdb.minAvailable nil }}
  minAvailable: {{ .Values.controller.pdb.minAvailable }}
  {{- else }}
  minAvailable: 1
  {{- end }}
  selector:
    matchLabels:
      {{- include "dra-driver-nvidia-gpu.selectorLabels" (dict "context" . "componentName" "controller") | nindent 6 }}
{{- end }}
{{- end }}
