# Simple 1-GPU passthrough claim.
---
apiVersion: v1
kind: Namespace
metadata:
  name: vfio-test1
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: vfio-rct
  namespace: vfio-test1
spec:
  spec:
    devices:
      requests:
      - exactly:
          allocationMode: ExactCount
          count: 1
          deviceClassName: vfio.gpu.nvidia.com
        name: gpu
---
apiVersion: v1
kind: Pod
metadata:
  name: busybox-pod
  namespace: vfio-test1
spec:
  containers:
    - name: test
      image: busybox
      command: ["sleep", "3600"]
      resources:
        claims:
          - name: dra-resource
  resourceClaims:
    - name: dra-resource
      resourceClaimTemplateName: vfio-rct
